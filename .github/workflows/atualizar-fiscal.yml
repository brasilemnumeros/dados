# Workflow da família Fiscal; o notebook e os dados vivem em indicadores/fiscal/.
name: atualizar fiscal
on:
  schedule:
    - cron: '0 15 4,20 * *'
  workflow_dispatch:
    inputs:
      seco:
        description: Executar sem publicar
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: atualizar-fiscal
  cancel-in-progress: false
jobs:
  atualizar:
    uses: ./.github/workflows/atualizar-familia.yml
    with:
      familia: fiscal
      seco: ${{ inputs.seco == true }}
    secrets:
      token: ${{ secrets.DADOS_BOT_TOKEN }}
