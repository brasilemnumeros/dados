name: validar
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      # Só o grupo `ci`: o gate não instala a stack de notebook de propósito.
      - run: uv sync --frozen --only-group ci
      - run: uv run --no-sync python scripts/validar.py
      - run: uv run --no-sync pytest -q
