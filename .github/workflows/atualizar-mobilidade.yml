# Workflow da família mobilidade; o notebook e os dados vivem em indicadores/mobilidade/.
name: atualizar mobilidade
on:
  schedule:
    - cron: '0 15 10 1,9 *'
  workflow_dispatch:
    inputs:
      seco:
        description: Executar sem publicar
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: atualizar-mobilidade
  cancel-in-progress: false
jobs:
  atualizar:
    uses: ./.github/workflows/atualizar-familia.yml
    with:
      familia: mobilidade
      seco: ${{ inputs.seco == true }}
    secrets:
      token: ${{ secrets.DADOS_BOT_TOKEN }}
